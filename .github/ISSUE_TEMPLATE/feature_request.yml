name: Feature request
description: Propose a focused tabletop workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Tabletop problem
      description: What becomes easier or faster for the DM or player?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed interaction
      description: Describe the controls and where they belong.
    validations:
      required: true
  - type: textarea
    id: small-screen
    attributes:
      label: 960x480 considerations
      description: Explain how the feature stays readable and touch-friendly on the target display.
